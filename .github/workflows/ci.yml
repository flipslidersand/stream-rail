name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.25"
      coverage-threshold: 60
      runner: ubuntu-latest

  reviewdog:
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: flipslidersand-labs/qa-workflows/.github/workflows/reviewdog-go.yml@main
    with:
      go-version: "1.25"

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@main
